# Publish the justerm-wasm-decode decoder to the public npm registry (#34, ADR-0008).
#
# Trigger: a `vX.Y.Z` tag. The npm package version is derived by wasm-pack from Cargo.toml (the
# workspace version), so one version bump moves the crate and the npm artifact together (AC4). The
# verify step below fails the publish if the tag and the built package version disagree, making the
# lockstep a hard gate rather than a convention.
#
# Auth is npm Trusted Publishing (OIDC, `id-token: write`): no repository secret. Setup once on
# npmjs.com: justerm-wasm-decode → Settings → Trusted publishing (`docs/agents/release.md` § Registry
# auth). No third-party action is introduced — wasm-pack is `cargo install`ed (as in fuzz.yml) and npm
# upgrades itself, matching the repo's supply-chain posture (ADR-0006).
name: publish-wasm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# The wasm build tool, pinned exactly (#616) — `docs/map/territory/release.md`.
# check-tool-pins.mjs keeps the copies identical; `docs/agents/release.md` decides when to move it.
env:
  WASM_PACK_VERSION: "0.15.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: the registry exchanges this job's GitHub OIDC token for a short-lived
    # publish credential, so no secret is stored (`docs/agents/release.md` § Registry auth).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build cache here, deliberately: it keeps the publish credential (`id-token: write`) away from
      # any third-party action
      # (ADR-0006; `docs/map/territory/release.md`).

      # Reject a README claim that expires, before the build spends any time
      # (`docs/map/territory/published-surface.md`). wasm-pack copies this README into the
      # npm tarball verbatim (`readme = "README.md"` in Cargo.toml).
      - name: Verify the README makes no expiring claim
        run: node .github/scripts/check-published-readme.mjs justerm-wasm-decode/README.md

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version "${{ env.WASM_PACK_VERSION }}"

      # Bundler target is the published artifact (PenTerm's Vite/webpack consumes it).
      # finish-pkg folds in the hand-written colour helpers (colors.js/.d.ts).
      - name: Build (bundler)
        run: |
          wasm-pack build --target bundler --out-dir pkg justerm-wasm-decode
          node justerm-wasm-decode/scripts/finish-pkg.mjs justerm-wasm-decode/pkg

      # Version-lockstep gate (AC4): the tag (minus the `v`) must equal the package version wasm-pack
      # wrote from the crate version. A mismatch means an artifact would publish under a version that
      # is not the one tagged — fail instead.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./justerm-wasm-decode/pkg/package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag v$tag != package version $pkg"; exit 1; }

      # The dual-licence texts are handled by `finish-pkg.mjs` in the build step above: it copies them
      # into `pkg/` AND pushes them into `package.json`'s `files` — both are required (#472).

      # Trusted publishing needs npm >= 11.5.1; the runner image ships npm 10
      # (`docs/map/territory/release.md`).
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish to npm
        run: |
          # `./` prefix: without it npm parses `justerm-wasm-decode/pkg` as a GitHub
          # owner/repo shorthand, not a local folder, and fails on git ls-remote.
          npm publish ./justerm-wasm-decode/pkg --access public
