# Build / format / lint / test gate. The toolchain comes from rust-toolchain.toml. Why each step is
# shaped the way it is: `docs/map/territory/ci-and-supply-chain.md`.
name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# The wasm build tool, pinned (#616). Held in agreement by check-tool-pins.mjs; its refresh trigger
# is in `docs/agents/release.md`.
env:
  WASM_PACK_VERSION: "0.15.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Format
        run: cargo fmt --all --check
      # --workspace so the justerm-wasm-decode binding (the flatten core's host unit tests) is gated too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # rustdoc's own lint layer: `cargo test` runs doctests and clippy does not carry rustdoc lints,
      # so neither checks that a doc-comment's links resolve on the public page.
      - name: Docs (rustdoc lints — links must resolve on the PUBLIC page)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # `justerm-facade` is EXCLUDED from the root workspace, so the line above never builds it; the
      # rustdoc pointer gate below needs its page (`docs/map/invariant/workspace-exclusion-is-gate-invisibility.md`).
      - name: Docs (the tombstone — outside the workspace, so --workspace misses it)
        run: cargo doc --manifest-path justerm-facade/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The markdown counterpart of the rustdoc gate: relative links and `#anchors` across the docs.
      # Every PR, because these documents are read by whoever picks up the next change.
      - name: Doc links (relative paths + #anchors resolve)
        run: node .github/scripts/check-map-links.mjs docs CLAUDE.md CONTEXT.md README.md
      # The per-note check, run over every note so a note edited later by someone who never ran it
      # is caught too.
      - name: Map note schema (sections + symbols under ## Code)
        run: |
          bad=0
          for f in docs/map/territory/*.md docs/map/invariant/*.md; do
            node .github/scripts/check-map-note.mjs "$f" || bad=1
          done
          exit $bad
      # The build-tool pin (#616) lives in three workflow-level `env:` blocks; Dependabot does not
      # read `run:` lines, so this holds them together.
      - name: Build-tool pins agree across workflows
        run: node .github/scripts/check-tool-pins.mjs
      # The published-prose gates — manifest `description` + README, then the rendered rustdoc
      # (which reads `cargo doc` output, so it runs after the doc steps above). Why each runs per PR
      # and what it rejects: `docs/map/territory/published-surface.md`.
      - name: Published surfaces carry no repo-only pointers
        run: node .github/scripts/check-published-pointers.mjs
      - name: Published rustdoc carries no repo-only pointers
        run: node .github/scripts/check-published-rustdoc.mjs

  # justerm-renderer is EXCLUDED from the root workspace (its web-sys/glow deps are wasm32-only), so
  # every gate it needs is named here by manifest path (#333). Its pure modules test on the host; its
  # GL/wasm layer only compiles for wasm32.
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --manifest-path justerm-renderer/Cargo.toml --check
      # `--locked` here is the lockfile gate (#613). Deliberately on the first BARE cargo command —
      # through wasm-pack it inspects nothing (see the territory note named at the top).
      - name: Test (host — pure modules; asserts the lockfile)
        run: cargo test --manifest-path justerm-renderer/Cargo.toml --locked
      - name: Clippy (wasm32 — the GL layer is 0-compile on host)
        run: cargo clippy --manifest-path justerm-renderer/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Build (wasm32)
        run: cargo build --manifest-path justerm-renderer/Cargo.toml --target wasm32-unknown-unknown
      # Same rustdoc gate as the `test` job, by manifest path — `cargo doc --workspace` never reaches it.
      - name: Docs (rustdoc lints)
        run: cargo doc --manifest-path justerm-renderer/Cargo.toml --no-deps --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: -D warnings

  # The `demo/*.html` readPixels proofs (#328), swept across device pixel ratios (#331). Separate from
  # `renderer` on purpose: this job depends on a browser download, SwiftShader and the runner's fonts,
  # so a flake here must not redden the deterministic cargo gate. Chromium only, the colour-emoji font
  # from the runner image and Playwright's `tools` group, no WebGL flags — why: the territory note.
  renderer-proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justerm-renderer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version "${{ env.WASM_PACK_VERSION }}"
      # No new third-party action: the runner image ships Node. The `@10` is deliberate — pnpm 11
      # fails the install on the skipped build scripts (see the territory note).
      - name: Install pnpm
        run: npm install -g pnpm@10
        working-directory: .
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # Built ahead of the proofs so the `.d.ts` prose gate cannot sit behind a browser run; the
      # second `build:wasm` inside `test:proofs` is then a cargo no-op.
      - name: Build the renderer package (for the .d.ts gate below)
        run: pnpm run build:wasm
      # `working-directory: .` because this job defaults to `justerm-renderer`.
      - name: Published .d.ts carries no repo-only prose
        working-directory: .
        run: node .github/scripts/check-published-package.mjs justerm-renderer/pkg
      # The pixel helpers every proof reads its evidence through, plus the #731 harness-shape rule
      # the specs themselves must hold. Fast, browserless.
      - name: Unit (demo/proof.js helpers + harness shape)
        run: pnpm run test:unit
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Proofs (dpr 1 / 1.1 / 1.5 / 2)
        run: pnpm run test:proofs

  # justerm-web: typecheck, vitest and the tsup build (#341). It consumes the PUBLISHED
  # justerm-wasm-decode (not a workspace link), so this job needs no Rust.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justerm-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No new third-party action, and the `@10` pin matters — see `renderer-proofs` above.
      - name: Install pnpm
        run: npm install -g pnpm@10
        working-directory: .
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # Three tsconfig projects (#343): `src` is browser-only and refuses node's ambient globals,
      # `test`/`demo`/`e2e` get them, and the `*.config.ts` files get them without the DOM.
      - name: Typecheck (browser + test + node projects)
        run: pnpm run typecheck
      - name: Test (vitest)
        run: pnpm run test
      # Guards the artifact path only — that `tsup` resolves the entry, bundles and emits
      # `dist/index.d.ts`. A green here is not "the public types are sound" (#344; the territory note).
      - name: Build (tsup; artifact path only — see comment)
        run: pnpm run build

  # The a11y e2e (#160/#161): drives the real widget + real wasm decoder in headless Chromium and
  # asserts the aria-live announce + signal paths a screen reader would consume. Split from `web` for
  # the same reason `renderer-proofs` is split from `renderer`: a browser flake must not redden the
  # fast, deterministic gate beside it.
  web-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justerm-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The `@10` pin matters — see `renderer-proofs` above.
      - name: Install pnpm
        run: npm install -g pnpm@10
        working-directory: .
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      # `webServer` in playwright.config.ts starts `pnpm demo` (vite), so the real decoder runs.
      - name: E2E (a11y, input, wheel, fit)
        run: pnpm run test:e2e

  # The WASM decoder (#34, ADR-0008): build both wasm-pack targets and run the JS-boundary tests on
  # the wasm32 target. Separate from `test` because it needs the wasm32 target + wasm-pack, and the
  # tests/web.rs cases call js_sys (they self-exclude off-wasm via #![cfg(target_arch = "wasm32")]).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      # Installed through cargo, version-pinned (#616) — deliberately unlike fuzz.yml's cargo-fuzz
      # (see the territory note).
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version "${{ env.WASM_PACK_VERSION }}"
      - name: Test (node)
        run: wasm-pack test --node justerm-wasm-decode
      # Build both published targets — bundler (Vite/webpack) and web (no-bundler ESM) — so a break
      # in either is caught at PR time (AC1). Publishing happens in publish-wasm.yml on a tag.
      - name: Build (bundler)
        run: |
          wasm-pack build --target bundler --out-dir pkg-bundler justerm-wasm-decode
          node justerm-wasm-decode/scripts/finish-pkg.mjs justerm-wasm-decode/pkg-bundler
      # The `.d.ts` prose gate — it cannot run earlier, because the file does not exist until
      # wasm-pack runs (`docs/map/territory/published-surface.md`).
      - name: Published .d.ts carries no repo-only prose
        run: node .github/scripts/check-published-package.mjs justerm-wasm-decode/pkg-bundler
      - name: Build (web)
        run: |
          wasm-pack build --target web --out-dir pkg-web justerm-wasm-decode
          node justerm-wasm-decode/scripts/finish-pkg.mjs justerm-wasm-decode/pkg-web
      # Smoke the assembled package as a consumer imports it — guards the
      # finish-pkg packaging glue that unit/boundary tests don't see (#37).
      - name: Smoke (assembled package)
        run: node justerm-wasm-decode/scripts/smoke.mjs justerm-wasm-decode/pkg-bundler
      # End-to-end: decode a golden frame (generated by native encode) through a
      # nodejs-target build and resolve a known cell's colour (#37 stretch).
      - name: Smoke (end-to-end decode)
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node justerm-wasm-decode
          node justerm-wasm-decode/scripts/finish-pkg.mjs justerm-wasm-decode/pkg-node
          cargo run -q -p justerm-wasm-decode --example gen_smoke_frame -- justerm-wasm-decode/pkg-node/golden.jt
          node justerm-wasm-decode/scripts/smoke-decode.mjs justerm-wasm-decode/pkg-node justerm-wasm-decode/pkg-node/golden.jt
      # The same path, but starting one layer earlier: the bytes come out of a real
      # `Engine` rather than a hand-built `Frame`, so `feed -> frame -> encode ->
      # decodeFrame` is observed as one composition (#657). The step above cannot see a
      # group the engine stopped populating, because its fixture decides the contents.
      # Carries the two columns nothing else proves end to end — a grapheme cluster and
      # an OSC 8 hyperlink — and pins the span directory's stride-5 meaning, which no
      # type can carry.
      - name: Smoke (engine-produced frame)
        run: |
          cargo run -q -p justerm-wasm-decode --example gen_engine_frame -- justerm-wasm-decode/pkg-node/engine.jt
          node justerm-wasm-decode/scripts/smoke-engine-frame.mjs justerm-wasm-decode/pkg-node justerm-wasm-decode/pkg-node/engine.jt
