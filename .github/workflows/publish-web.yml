# Publish the justerm-web browser widget to the public npm registry (#466).
#
# Trigger: a `web-vX.Y.Z` tag. justerm-web is NOT on the workspace version-lockstep (`v*`, which
# publishes justerm-core + justerm-wasm-decode): it consumes justerm-wasm-decode and justerm-renderer
# through **caret ranges**, not the lockstep, and moves on its own cadence — so it carries its own tag
# prefix, exactly as justerm-renderer does (`renderer-v*`, #394). A `v*` tag does not publish it and a
# `web-v*` tag publishes only it. The verify step fails the publish when the tag and package.json
# disagree, making that a hard gate rather than a convention (mirrors publish-wasm/publish-renderer).
#
# Supply-chain posture (ADR-0006): the only action used is GitHub-owned `actions/checkout`, SHA-pinned;
# pnpm is installed with `npm install -g pnpm@10` rather than `pnpm/action-setup` deliberately, to keep
# the publish credential (`id-token: write`) away from a third-party action
# (`docs/map/territory/release.md`).
#
# Auth is npm Trusted Publishing (OIDC): no repository secret. Setup once on npmjs.com: justerm-web →
# Settings → Trusted publishing (`docs/agents/release.md` § Registry auth).
name: publish-web

on:
  push:
    tags:
      - "web-v*"
  # Verify-only: a manual run publishes nothing (`verify-auth` below).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Trusted publishing: the registry exchanges this job's GitHub OIDC token for a short-lived
    # publish credential, so no secret is stored (`docs/agents/release.md` § Registry auth).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reject a README claim that expires, before the build spends any time
      # (`docs/map/territory/published-surface.md`).
      - name: Verify the README makes no expiring claim
        run: node .github/scripts/check-published-readme.mjs justerm-web/README.md

      # The `@10` pin matters — see the `web` job in test.yml.
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: justerm-web

      # `files: ["dist"]` in package.json, so the tarball is the tsup output and nothing else — the
      # demo, e2e and tests are not shipped. This step does NOT re-run typecheck/test: the tag points
      # at a commit master already gated (test.yml), and re-running them here would only duplicate it.
      # Note tsup does not catch type errors on its own (#344) — a green build is an artifact-path
      # check, not a soundness claim.
      - name: Build (tsup)
        run: pnpm run build
        working-directory: justerm-web

      # Guard the artifact itself, not just the exit code: `files: ["dist"]` plus a build that emitted
      # nothing would publish an empty package that installs fine and imports to undefined. Assert the
      # entry and its types are actually inside the tarball npm is about to upload.
      # …and the licence texts (#472), which the `files` allowlist does not include by itself.
      - name: Verify the tarball carries the entry, its types and the licences
        run: |
          files="$(npm pack --dry-run --json ./justerm-web | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0].files.map(f=>f.path).join('\n')")"
          echo "$files"
          for want in dist/index.js dist/index.d.ts LICENSE-MIT LICENSE-APACHE; do
            echo "$files" | grep -qx "$want" || { echo "::error::$want missing from the tarball"; exit 1; }
          done

      # Version gate: the tag (minus the `web-v` prefix) must equal package.json's version. A mismatch
      # would publish an artifact under a version that is not the one tagged — fail instead.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#web-v}"
          pkg="$(node -p "require('./justerm-web/package.json').version")"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || { echo "::error::tag web-v$tag != package version $pkg"; exit 1; }

      # Trusted publishing needs npm >= 11.5.1; the runner image ships npm 10
      # (`docs/map/territory/release.md`).
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Publish to npm (idempotent — skip if the version is already on the registry)
        run: |
          pkg="$(node -p "require('./justerm-web/package.json').version")"
          # A version already on npm cannot be re-published (npm 403). Skip gracefully so re-tagging is
          # always safe. `npm view pkg@ver version` prints the version when it exists, empty when not.
          if [ -n "$(npm view "justerm-web@$pkg" version 2>/dev/null || true)" ]; then
            echo "justerm-web@$pkg is already on npm — skipping publish."
          else
            # `./` prefix: without it npm parses `justerm-web` as a GitHub owner/repo shorthand.
            npm publish ./justerm-web --access public
          fi

  # #474: a GitHub Release for this track, deliberately a separate job so `contents: write` never
  # shares a job with `id-token: write` (`docs/map/territory/release.md`).
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the body is the tag's annotation, absent from a shallow clone
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `%(contents)` is the tag's annotation (a lightweight tag falls through to its commit
          # message), so `--generate-notes` below is a last resort only.
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -n "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # A manual run proves the registry accepts this workflow's OIDC token for justerm-web, and publishes
  # nothing (`docs/agents/release.md` § Registry auth).
  verify-auth:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11
          npm --version
      - name: Verify the trusted publisher (no publish)
        run: bash .github/scripts/verify-trusted-publish.sh npm justerm-web
