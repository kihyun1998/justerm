# Publish the justerm-core crate to crates.io (the Rust-consumer track).
#
# Sibling of publish-wasm.yml: the SAME `vX.Y.Z` tag publishes both the crate (here) and the
# justerm-wasm-decode npm artifact (there), so the two registries stay version-locked from one tag. The
# workspace version is the single source — bump `[workspace.package] version`, tag the matching
# `vX.Y.Z`, and both publish at that version.
#
# Auth is crates.io Trusted Publishing: the publish step exchanges this job's GitHub OIDC token for a
# short-lived crates.io token and revokes it when the step exits. No repository secret. Setup once on
# crates.io: justerm-core → Settings → Trusted Publishing (`docs/agents/release.md` § Registry auth).
#
# A crates.io version cannot be re-published: re-tagging an already-published version fails here
# ("already uploaded").
name: publish-crate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: the registry exchanges this job's GitHub OIDC token for a short-lived
    # publish credential, so no secret is stored (`docs/agents/release.md` § Registry auth).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No build cache here, deliberately: it keeps the publish credential (`id-token: write`) away from
      # any third-party action (ADR-0006; `docs/map/territory/release.md`).

      # This publish snapshots the README onto the registry front page. Reject a claim that expires
      # ("under construction", "lands in #N") — at publish time only, deliberately
      # (`docs/map/territory/published-surface.md`).
      - name: Verify the README makes no expiring claim
        run: node .github/scripts/check-published-readme.mjs justerm-core/README.md

      # Version-lockstep gate: the tag (minus `v`) must equal the crate version, mirroring
      # publish-wasm.yml's check so a mismatched tag fails before publishing.
      - name: Verify tag matches crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="justerm-core") | .version')"
          echo "tag=$tag crate=$crate"
          test "$tag" = "$crate" || { echo "::error::tag v$tag != crate version $crate"; exit 1; }

      # -p justerm-core only; justerm-wasm-decode is publish = false (npm-only), so it is never sent to crates.io.
      # The exchange is done here rather than with rust-lang/crates-io-auth-action, so no third-party
      # code runs in a job that can mint a publish credential (`docs/map/territory/release.md`).
      - name: Publish to crates.io (trusted publishing)
        run: |
          set -euo pipefail
          api=https://crates.io/api/v1/trusted_publishing/tokens
          ua="justerm-publish-crate (github.com/kihyun1998/justerm)"
          jwt="$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates.io" | jq -r .value)"
          test -n "$jwt" && test "$jwt" != null || { echo "::error::no GitHub OIDC token (is id-token: write set?)"; exit 1; }
          echo "::add-mask::$jwt"
          token="$(curl -sS --fail-with-body -A "$ua" -H 'Content-Type: application/json' \
            -d "{\"jwt\":\"$jwt\"}" "$api" | jq -r .token)"
          test -n "$token" && test "$token" != null || { echo "::error::crates.io returned no token"; exit 1; }
          echo "::add-mask::$token"
          # Revoke on every exit path, publish failure included.
          trap 'curl -sS -X DELETE -A "$ua" -H "Authorization: Bearer $token" "$api" || true' EXIT
          CARGO_REGISTRY_TOKEN="$token" cargo publish -p justerm-core --locked
