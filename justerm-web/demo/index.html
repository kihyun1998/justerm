<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>justerm-web S4 — scrollbar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* #577: a CHECKERBOARD, not the terminal's own `#1e1e2e`, and that is the whole point.
           This was byte-identical to `defaultBg` in demo/main.ts, so compositing the terminal over
           it at any alpha produced the same pixels — the "Bg alpha" button changed nothing a human
           could see, on the only real-browser surface this package has. The e2e never noticed
           because `readPixels` reads the drawing buffer BEFORE the compositor touches it, which is
           exactly the gap: a green pixel test and an invisible feature are compatible states.
           The conventional transparency backdrop is used deliberately — it makes any alpha legible
           at a glance, where a single flat colour only reveals the extremes. */
        background-color: #1e1e2e;
        background-image:
          linear-gradient(45deg, #2a2a3c 25%, transparent 25%, transparent 75%, #2a2a3c 75%),
          linear-gradient(45deg, #2a2a3c 25%, transparent 25%, transparent 75%, #2a2a3c 75%);
        background-size: 32px 32px;
        background-position: 0 0, 16px 16px;
      }
      #term {
        width: 100vw;
        height: 100vh;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Manual harness: run `pnpm demo` (NOT `vite demo` — that skips
         vite.config.ts and its wasm plugins) and open the printed URL.
         Verifies S4's scrollbar — drag the thumb on the right to scroll back. -->
    <canvas id="term"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
