<!doctype html>
<meta charset="utf-8" />
<title>justerm-renderer proof — the underline's place follows the ink class (#712)</title>
<style>
  body { margin: 0; background: #000; }
  #c { display: block; image-rendering: pixelated; }
</style>
<!--
  #712 / ADR-0019 rule 6: occlusion between ink sources follows their CLASS. R1 puts a
  BACKGROUND-class glyph's ink on the background channel; `I_underline` is TEXT class always. So the
  band draws UNDER a letter (a descender crossing it survives) and OVER a tile (the band stays
  visible on `█▄▓░`). Until #712 both bands drew over everything, which was invisible while the two
  inks were equal and became total the moment #520's `SGR 58` made them differ.

  THE INSTRUMENT. With fg = white, the underline = pure red and bg = black, the GREEN channel is
  exactly `255 x glyph coverage` — the underline contributes none of it and the background none. So
  glyph survival inside the band is read off one channel analytically, with no threshold to tune and
  no "brightest pixel" heuristic. The band's own scanlines are located from a SPACE cell, which has
  no glyph, so the locator is order-independent by construction.

  THE WINDOW COMES FIRST. A third row carries the same text with NO underline: it says how much glyph
  ink even lives in those scanlines. Without it "the descender survives" could hold vacuously in a
  font whose descenders never reach the band — the proof would then be asserting nothing and looking
  green. `theWindowExists` fails loudly in that case instead.

  IT DISCRIMINATES AGAINST BOTH WRONG ORDERS, and against a packer that never publishes the class.
  All three were run: forcing `bg_class = 1.0` (bands over everything, the pre-#712 order) reddens
  `aDescenderSurvivesAColouredUnderline` + `theDescenderInkIsUndamaged`; forcing it to `0.0` (the
  blanket "underline always first" that ghostty and xterm.js take — neither has a background ink
  class to order against) reddens `theBandDrawsOverEveryTile`; and dropping the class in
  `frame.rs::pack_instances` reddens the same one, which is what proves the bit travels rather than
  the shader merely reading a constant. The blanket mutation passed an earlier draft of this page,
  where the tile check was row-wide — see `bandInkPerColumn`.

  Runner sweeps dpr 1 / 1.1 / 1.5 / 2.

  Build: wasm-pack build --target web --dev --out-dir pkg
-->
<canvas id="c" width="64" height="32"></canvas>
<script type="module">
  import init, { JustermRenderer } from "../pkg/justerm_renderer.js";
  import { readRect, fitGrid } from "./proof.js";
  await init();

  const UNDERLINE = 1 << 3;
  const STRIKETHROUGH = 1 << 7;
  const SPACE = 0x20;
  const RGB = (c) => ((2 << 24) | c) >>> 0;

  // col 5 is a SPACE in every row: no glyph, so it locates the band whatever the order is.
  const COLS = 6, ROWS = 5, N = COLS * ROWS;
  const TEXT = [...'gjpqy'].map((c) => c.codePointAt(0));   // descenders, all five
  const TILES = [...'█▄▀▓░'].map((c) => c.codePointAt(0));  // BACKGROUND class (R1)
  const ROW = { SGR58: 0, FOLLOW_FG: 1, BARE: 2, TILES: 3, STRIKE: 4 };

  const palette = new Uint32Array(256);
  const r = new JustermRenderer("#c");
  const g = r.addGrid(palette, 0xffffff, 0x000000);   // fg WHITE, bg BLACK
  const gl = document.querySelector("#c").getContext("webgl2");

  // Big enough that a descender is several device px deep at every dpr the runner sweeps.
  r.setFontSize(g, 44);
  fitGrid(r, g, COLS, ROWS);
  const canvas = document.querySelector("#c");
  canvas.style.width = r.cssWidth() + "px";
  canvas.style.height = r.cssHeight() + "px";

  const cps = new Uint32Array(N).fill(SPACE);
  const flags = new Uint16Array(N);
  const uc = new Uint32Array(N);
  for (let row = 0; row < ROWS; row++) {
    const glyphs = row === ROW.TILES ? TILES : TEXT;
    for (let col = 0; col < 5; col++) cps[row * COLS + col] = glyphs[col];
    for (let col = 0; col < COLS; col++) {
      const i = row * COLS + col;
      if (row !== ROW.BARE) flags[i] = UNDERLINE;
      if (row === ROW.STRIKE) flags[i] |= STRIKETHROUGH;
      if (row !== ROW.FOLLOW_FG) uc[i] = RGB(0xff0000);   // every row but one declares SGR 58 red
    }
  }
  r.apply_frame(g, COLS, ROWS, new Uint32Array(N), new Uint32Array(N), cps, flags, true, uc);
  r.render();

  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  const img = { ...readRect(gl, { x: 0, y: 0, w, h }), w, h };
  const px = (x, y) => { const i = ((h - 1 - y) * w + x) * 4; return [img.buf[i], img.buf[i + 1], img.buf[i + 2]]; };
  const cw = r.cell_width(g), ch = r.cell_height(g);
  const isRed = ([rr, gg, bb]) => rr >= 150 && gg <= 60 && bb <= 60;

  // The band's scanlines, read off the glyph-less SPACE cell of row 0.
  const band = [];
  for (let dy = 0; dy < ch; dy++) {
    if (isRed(px(5 * cw + (cw >> 1), ROW.SGR58 * ch + dy))) band.push(dy);
  }

  /** Green summed over the glyph columns inside the band — i.e. glyph ink that survived there. */
  const glyphInkInBand = (row) => {
    let sum = 0, lit = 0;
    for (const dy of band) for (let x = 0; x < 5 * cw; x++) {
      const g = px(x, row * ch + dy)[1];
      sum += g; if (g >= 64) lit++;
    }
    return { sum, lit };
  };
  /** Underline pixels surviving in the band over the glyph columns. */
  const bandInkInBand = (row) => {
    let n = 0;
    for (const dy of band) for (let x = 0; x < 5 * cw; x++) if (isRed(px(x, row * ch + dy))) n++;
    return n;
  };
  /**
   * The same, PER COLUMN — which matters because the five tiles are not equally at risk. `▀` (the
   * upper half block) does not reach the band at all, so its band ink survives under every possible
   * order. A whole-row `> 0` is therefore made true by the one cell the defect cannot touch: the
   * blanket order was measured to leave `[0, 0, 66, 0, 0]` and a row-wide check passed it.
   */
  const bandInkPerColumn = (row) => [0, 1, 2, 3, 4].map((c) => {
    let n = 0;
    for (const dy of band) for (let x = c * cw; x < (c + 1) * cw; x++) {
      if (isRed(px(x, row * ch + dy))) n++;
    }
    return n;
  });

  const sgr58 = glyphInkInBand(ROW.SGR58);
  const bare = glyphInkInBand(ROW.BARE);
  const followFg = glyphInkInBand(ROW.FOLLOW_FG);
  const tilesPerCol = bandInkPerColumn(ROW.TILES);

  // The strike band sits at 0.5 of the glyph box, above the underline's 0.88. Locate it the same
  // order-independent way — off the glyph-less SPACE cell — and read its colour there.
  //
  // What is deliberately NOT asserted, and why: whether the strike draws over or under the glyph.
  // Nothing can see it. A strikethrough has no declared-colour regime (#525 — no SGR sets one), so
  // its ink IS the cell's fg, and a band whose colour equals the ink it covers composites to the
  // same pixels in either order. That is the same algebra that makes the follow-fg underline row
  // above byte-identical across the two orders. Asserting it here would be a check that can only
  // confirm its own premise. The strike's `mix` is the last one in the shader and this change does
  // not move it; what IS observable — that it is drawn, and in the follow-fg ink rather than the
  // SGR 58 colour — is asserted below and is #525's property, pinned harder in
  // `strike-vs-underline-ink.html`.
  const strikeRow = (() => {
    const rows = [];
    for (let dy = 0; dy < band[0]; dy++) {
      const [rr, gg, bb] = px(5 * cw + (cw >> 1), ROW.STRIKE * ch + dy);
      if (rr >= 150 && gg >= 150 && bb >= 150) rows.push(dy);
    }
    if (!rows.length) return { rows, best: [0, 0, 0] };
    const dy = rows[rows.length >> 1];
    return { rows, best: px(5 * cw + (cw >> 1), ROW.STRIKE * ch + dy) };
  })();

  const checks = {
    // 0. The window. Everything below is about ink inside the band; if the font puts no descender
    //    there, say so rather than passing vacuously.
    theWindowExists: band.length > 0 && bare.lit > 0,

    // 1. A descender crossing a declared-colour underline survives it at all...
    aDescenderSurvivesAColouredUnderline: sgr58.lit > 0,
    // ...and is UNDAMAGED: the same ink, to the byte, as with no underline present. `>0` alone would
    //    pass on a fix that merely blended the two.
    theDescenderInkIsUndamaged: sgr58.sum === bare.sum && sgr58.lit === bare.lit,

    // 2. The band is still there — the glyph did not eat it in return.
    theColouredBandIsStillDrawn: bandInkInBand(ROW.SGR58) > 0,

    // 3. A follow-fg underline shows a SOLID band: its ink is the glyph's, so the two cannot be told
    //    apart and the reorder must be invisible. (Byte-identity across the two orders is proved
    //    algebraically — with fg == base_ul the two composites are the same expression — and was
    //    measured by hash before the change; a live page can only see one order at a time.)
    aFollowFgUnderlineStaysSolid: followFg.lit === 5 * cw * band.length,

    // 4. Over a BACKGROUND-class glyph the class inverts the order: the band draws OVER the tile.
    //    EVERY tile, not just some — `▀` alone keeps its band under the blanket order too, so a
    //    row-wide `> 0` here passes the very mutation this check exists to catch (measured).
    theBandDrawsOverEveryTile: tilesPerCol.every((n) => n > 0),

    // 5. The strikethrough is untouched: still drawn, still in the follow-fg ink and not the SGR 58
    //    colour, on a cell that carries BOTH marks. (Its z-order is unobservable — see above.)
    theStrikeIsStillDrawn: strikeRow.rows.length > 0,
    theStrikeKeepsTheFollowFgInkNotTheSgr58Colour:
      strikeRow.best[0] >= 200 && strikeRow.best[1] >= 200 && strikeRow.best[2] >= 200,
  };

  window.__proof = {
    ok: Object.values(checks).every(Boolean), checks, dpr: devicePixelRatio,
    cw, ch, bandRows: band.length, sgr58, bare, followFg, tilesPerCol, strikeRow,
  };
  window.__done = true;
</script>
