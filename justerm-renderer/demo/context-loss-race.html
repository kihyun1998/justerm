<!doctype html>
<meta charset="utf-8" />
<title>justerm-renderer proof — render() in the pre-dispatch window (#695)</title>
<style>
  body { margin: 0; background: #000; }
  #c { display: block; image-rendering: pixelated; }
</style>
<!--
  #695 proof: `render()` asks `ContextState::action()`, which used to consult only the state
  machine's FLAG. A browser destroys a context SYNCHRONOUSLY and merely QUEUES `webglcontextlost`,
  so there is a slice in which the context is already dead and nothing has been reported. Two
  distinct things go wrong in that slice, and they are different sections below because they are
  different arms of `action()`:

    A. `pending_rebuild` set  -> the flag says Rebuild -> `restore()` runs on a dead context ->
       `link_program`'s compile-status check fails with an EMPTY info log -> `render()` throws
       `"justerm-renderer: "`, against its own doc promising a silent no-op.
    B. nothing pending        -> the flag says Draw    -> the frame is packed, glyphs are resolved
       and uploaded into a dead atlas. Harmless (the restore re-derives all of it) but wasted, and
       it is the row ADR-0027's conformance map recorded as "covered from behind".

  `action()` now takes the context's own answer (`ContextLiveness`) and composes it with the flag,
  so both arms skip.

  WHAT THIS PAGE DELIBERATELY DOES NOT CLAIM. Section A cannot prove that the deferred rebuild
  SURVIVED the skip, because `on_restored()` sets `pending_rebuild` unconditionally — the latch is
  re-armed by the very restore that would let us observe it, so "the pixels came back" is true
  whether the skip preserved it or not. That property is asserted where it can be: the host test
  `the_same_loss_before_its_event_is_dispatched_still_skips_the_rebuild` in `context_loss.rs`. What
  this page proves is what only a browser can: that the wiring really asks the context, that
  nothing throws, and that recovery still works.

  Build: wasm-pack build --target web --dev --out-dir pkg
-->
<canvas id="c" width="256" height="32"></canvas>
<script type="module">
  import init, { JustermRenderer } from "../pkg/justerm_renderer.js";
  import { readCells, countLit, gridFit, fitGrid } from "./proof.js";
  const FG = 0xffffff, BG = 0x1e1e2e;
  await init();

  const palette = new Uint32Array(256);
  const r = new JustermRenderer("#c");
  const g = r.addGrid(palette, FG, BG);
  const COLS = 4;
  fitGrid(r, g, COLS, 1);
  const canvas = document.querySelector("#c");
  const gl = canvas.getContext("webgl2");
  const lose = gl.getExtension("WEBGL_lose_context");
  if (!lose) throw new Error("WEBGL_lose_context unavailable — cannot prove #695");
  const once = (e) => new Promise((res) => canvas.addEventListener(e, res, { once: true }));
  const yieldTask = () => new Promise((res) => setTimeout(res, 0));
  const row = () => Array.from({ length: COLS }, (_, i) => countLit(readCells(gl, r, g, i)));

  const zeros = new Uint32Array(COLS);
  const flags = new Uint16Array(COLS);
  const A = new Uint32Array([0x41, 0x42, 0x43, 0x44]);
  r.apply_frame(g, COLS, 1, zeros, zeros, A, flags, true);
  r.render();
  const baseline = row();

  // --- A. the Rebuild arm ------------------------------------------------------------------------
  // lose -> restore -> DO NOT RENDER -> lose again with no await -> render().
  //
  // The omitted render is the whole construction: a render here would take the Rebuild path and
  // clear `pending_rebuild`, leaving nothing for the window to act on. Do not "tidy" one in — the
  // rebuild is not skipped, it is postponed, and it lands at the render after the SECOND restore
  // below, which is what `recoversAfterTheWindow` reads.
  const lostA = once("webglcontextlost");
  lose.loseContext();
  await lostA;
  await yieldTask();
  const restoredA = once("webglcontextrestored");
  lose.restoreContext();
  await restoredA;
  const flagAfterRestore = r.isContextLost();

  lose.loseContext(); // no await: this is the pre-dispatch slice
  const raceA = { glSaysLost: gl.isContextLost(), rendererSaysLost: r.isContextLost() };
  const packsBeforeA = r.packs();
  let threwA = null;
  try { r.render(); } catch (e) { threwA = { type: typeof e, text: String(e.message ?? e) }; }
  const packsAfterA = r.packs();

  // Let it settle and come back; the postponed rebuild runs on THIS render.
  await once("webglcontextlost");
  await yieldTask();
  const restoredA2 = once("webglcontextrestored");
  lose.restoreContext();
  await restoredA2;
  let threwRecover = null;
  try { r.render(); } catch (e) { threwRecover = String(e.message ?? e); }
  const afterWindow = row();

  // --- B. the Draw arm ---------------------------------------------------------------------------
  // Same window, nothing pending. Before this change `render` took the Draw path here and ran the
  // deferred pack (#421) on a dead context — resolving glyphs and uploading into a dead atlas, all
  // of it discarded. `packs()` measured +1; it must now be 0. This is ADR-0027's third conformance
  // row, the one recorded as "covered from behind".
  //
  // The dirt is made by a CPU-only setter, NOT by `apply_frame`, and that is the whole care of this
  // section: `apply_frame` calls `resolve_and_pack` *itself* (`webgl.rs`), with no liveness guard of
  // its own — a separate, still-open row that this change does not touch. Packing through it here
  // would measure that row and credit this fix with it. `setBoldToBright` only flips a policy field
  // and marks the buffer dirty, so the pack it causes is unambiguously `render`'s.
  lose.loseContext(); // no await again
  const raceB = { glSaysLost: gl.isContextLost(), rendererSaysLost: r.isContextLost() };
  let threwB = null;
  r.setBoldToBright(g, false); // CPU-only: marks needs_repack, touches no GL
  const packsBeforeB = r.packs();
  try { r.render(); } catch (e) { threwB = String(e.message ?? e); }
  const packsAfterB = r.packs();
  r.setBoldToBright(g, true); // back to the default so the control below is comparable

  await once("webglcontextlost");
  await yieldTask();
  const restoredB = once("webglcontextrestored");
  lose.restoreContext();
  await restoredB;
  r.render();
  const afterB = row();

  // --- control: the ordinary path still draws ------------------------------------------------------
  r.apply_frame(g, COLS, 1, zeros, zeros, A, flags, true);
  r.render();
  const control = row();

  window.__proof = {
    baseline, flagAfterRestore, raceA, threwA, packsA: packsAfterA - packsBeforeA,
    threwRecover, afterWindow, raceB, threwB, packsB: packsAfterB - packsBeforeB, afterB, control,
    gridFit: gridFit(gl, r, g, r.cols(g), r.rows(g)),
    checks: {
      baselineRenders: baseline.every((n) => n > 0),
      // PRECONDITIONS — asserted before any behaviour inside the window, so that a browser which
      // ever dispatched `webglcontextlost` synchronously would REPORT that rather than let these
      // sections pass vacuously. `flagAfterRestore` additionally pins that the restore was seen,
      // which is what puts `pending_rebuild` in play for section A.
      theRestoreWasSeen: flagAfterRestore === false,
      sectionAIsInThePreDispatchWindow:
        raceA.glSaysLost === true && raceA.rendererSaysLost === false,
      sectionBIsInThePreDispatchWindow:
        raceB.glSaysLost === true && raceB.rendererSaysLost === false,

      // A. THE assertion. Measured before the fix: a throw, `typeof "string"`, text
      // `"justerm-renderer: "` — an empty shader-compile log from a dead context.
      aRenderInTheWindowDoesNotThrowEvenWithARebuildPending: threwA === null,
      // ...and it did not quietly do the GPU work either. Skip returns before the pack.
      andItDoesNoWorkThere: packsAfterA - packsBeforeA === 0,
      // The postponed rebuild lands on the render after the next restore, and the frame is intact.
      recoversAfterTheWindow:
        threwRecover === null && afterWindow.join() === baseline.join(),

      // B. the Draw arm — ADR-0027's third conformance row. `packs()` was +1 here; the work was
      // discarded by the driver and re-derived at restore, so nothing broke and nothing noticed.
      aDrawInTheWindowPacksNothing: packsAfterB - packsBeforeB === 0,
      andDoesNotThrow: threwB === null,
      // Skipping the pack cost no content: the restore re-derives from the stored grid, so the
      // frame is intact afterwards. Without this, a `render` that skipped everything forever would
      // satisfy the check above.
      andTheContentSurvivesTheSkippedPack: afterB.join() === baseline.join(),

      // CONTROL: the guard did not eat the ordinary path.
      theOrdinaryPathStillDraws: control.join() === baseline.join(),
    },
  };
  window.__proof.ok = Object.values(window.__proof.checks).every(Boolean);
  window.__done = true;
</script>
