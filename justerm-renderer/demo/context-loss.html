<!doctype html>
<meta charset="utf-8" />
<title>justerm-renderer proof — WebGL context loss + auto recovery (#269)</title>
<style>
  body { margin: 0; background: #000; }
  #c { display: block; image-rendering: pixelated; }
</style>
<!--
  #269 proof: drive a REAL context loss through the real wasm renderer via the
  `WEBGL_lose_context` extension, and verify it heals itself.

  The load-bearing assertion is `recoveredMatchesBaseline`: after the restore we call `render()`
  and NOTHING ELSE — no `apply_frame`, no re-resolve, no re-upload from the consumer. The pixels
  must come back identical. That can only happen if `restore()` rebuilt the program/VAO/VBO/atlas,
  re-baked the resident glyphs into their same slots, AND invalidated the dirty-region upload
  baseline (#263's `uploaded` mirror still described the destroyed buffer, so a byte-identical
  frame would otherwise diff to zero ranges and leave the fresh VBO empty → permanent blank).

  Also (#370): a bar cursor set before the loss must come back after the restore, since `restore()`
  re-fetches the three cursor uniform locations bound to the relinked program.

  And (#639): a `resize` that lands INSIDE the loss window must not clobber the grid. That one is a
  property of `resize`, not of the recovery path, but it can only be observed here — a lost context
  is the only thing that makes `drawingBufferWidth` read back 0.

  Build: wasm-pack build --target web --dev --out-dir pkg
-->
<canvas id="c" width="256" height="32"></canvas>
<script type="module">
  import init, { JustermRenderer } from "../pkg/justerm_renderer.js";
  import { deviceCell, readCells, countLit, gridFit } from "./proof.js";
  const FG = 0xffffff, BG = 0x1e1e2e;
  await init();

  const WIDE_CHAR = 1 << 8, WIDE_SPACER = 1 << 9;

  const palette = new Uint32Array(256);
  const r = new JustermRenderer("#c", palette, FG, BG);
  const CW = r.cell_width(), CH = r.cell_height();
  const COLS = 6;
  r.resize(COLS, 1);

  const canvas = document.querySelector("#c");
  const gl = canvas.getContext("webgl2"); // the SAME context the renderer holds
  const lose = gl.getExtension("WEBGL_lose_context");
  if (!lose) throw new Error("WEBGL_lose_context unavailable — cannot prove #269");

  // Lit-pixel count of cell `col`, over the renderer's exact device cell. Re-read every call: the
  // restore re-reads the live DPR and can re-measure the cell (#328).
  const cellLit = (col) => countLit(readCells(gl, r, col));
  const row = () => Array.from({ length: COLS }, (_, i) => cellLit(i));
  // #370: cursor-red pixels of cell `col` — red high, green/blue low, to tell the bar from the white
  // glyphs whose red channel also clears the `countLit` threshold.
  const cursorLit = (col) => {
    const { buf } = readCells(gl, r, col);
    let n = 0;
    for (let i = 0; i < buf.length; i += 4) if (buf[i] > 150 && buf[i + 1] < 100 && buf[i + 2] < 100) n++;
    return n;
  };
  const once = (event) => new Promise((res) => canvas.addEventListener(event, res, { once: true }));

  // The frame deliberately spans all three glyph paths, because `restore()` re-bakes each
  // differently and an ASCII-only frame would prove only the easiest one:
  //   cols 0-1  "WX"  — prebaked ASCII fast path (fixed slots 0..=94)
  //   col  2    U+2500 ─ — a DYNAMIC glyph: lives in the glyph cache's normal region, so the
  //                        restore must walk `cache.entries()` and re-rasterise it into its slot
  //   cols 3-4  U+4E2D 中 — a DYNAMIC WIDE glyph: `slot_id >= WIDE_BASE`, so the restore must
  //                        re-split one double-width bitmap across two adjacent atlas slots
  //   col  5    "Z"   — ASCII again, after the wide pair, to catch a slot-offset error
  // beamterm's restore drops exactly the middle two cases: `recreate_texture` clears the cache and
  // re-uploads ASCII only (dynamic_atlas.rs), leaving every non-ASCII cell blank until new content
  // re-resolves it. `recoveredMatchesBaseline` below is what forbids that.
  const cps = new Uint32Array([0x57, 0x58, 0x2500, 0x4e2d, 0x20, 0x5a]);
  const flags = new Uint16Array([0, 0, 0, WIDE_CHAR, WIDE_SPACER, 0]);
  const zeros = new Uint32Array(COLS);

  // #370: a bar cursor on col 5 ('Z') must survive the loss+restore. `self.cursor` is CPU state, and
  // `restore()` re-fetches the THREE cursor uniform locations (bound to the relinked program) and
  // re-sets them on the next `render()`. If it forgot any of them, the bar would not come back. The
  // #368 guard is off so the red stays predictable — this proves recovery, not contrast.
  const CURSOR_RED = 0xff0000, BAR = 2, CURSOR_COL = 5;
  r.setCursorContrast(1.0);
  r.setCursor(CURSOR_COL, 0, BAR, CURSOR_RED, 0x000000);

  r.apply_frame(COLS, 1, zeros, zeros, cps, flags, true);
  r.render();
  const baseline = row();
  const cursorBaseline = cursorLit(CURSOR_COL);

  // --- kill it -------------------------------------------------------------------------------
  // Our `webglcontextlost` listener was registered in the constructor, i.e. before the one `once()`
  // attaches, so the renderer's state is already updated when this resolves.
  const lostEvent = once("webglcontextlost");
  lose.loseContext();
  await lostEvent;
  const lostFlag = r.isContextLost();

  // A frame issued while lost must be a silent no-op, not a throw and not a draw call.
  let threwWhileLost = false;
  try { r.render(); } catch { threwWhileLost = true; }

  // --- bring it back -------------------------------------------------------------------------
  // Chrome only permits `restoreContext()` once the `webglcontextlost` dispatch has fully
  // completed and it has seen the event cancelled. Awaiting the event is NOT enough: the promise
  // continuation is a microtask that runs while dispatch is still unwinding, and the call is
  // rejected with `INVALID_OPERATION: context restoration not allowed`. Yield a real macrotask.
  // (Verified in-browser: prevent+yield restores; prevent-only and yield-only both hang.)
  await new Promise((res) => setTimeout(res, 0));

  const restoredEvent = once("webglcontextrestored");
  lose.restoreContext();
  await restoredEvent;
  const restoredFlag = r.isContextLost();

  // The whole point: no `apply_frame`. The renderer alone must repaint the pre-loss frame.
  let threwOnRestore = false;
  try { r.render(); } catch (e) { threwOnRestore = true; console.error(e); }
  const recovered = row();
  const cursorRecovered = cursorLit(CURSOR_COL);

  // A subsequent identical frame still costs zero GPU work (the #263 diff is live again, with a
  // baseline that now describes the REAL buffer contents rather than the destroyed one).
  r.apply_frame(COLS, 1, zeros, zeros, cps, flags, true);
  r.render();
  const steady = row();

  // --- #639: a resize that lands INSIDE the loss window ----------------------------------------
  // `resize` reads `drawingBufferWidth` back to adopt what the browser actually granted (#339). On a
  // lost context that read returns 0, so `cells_that_fit` floors both axes and the grid becomes 1x1
  // — and `restore()` re-derives the buffer from that clobbered grid, so the terminal comes back one
  // cell wide, permanently. Nothing throws, and until #579 a web consumer cannot even see that the
  // context is lost, so it has no way to suppress its own re-fit. The other four entry points that
  // resize something have guarded this all along; `resize` was the fifth and the asymmetry was the
  // tell (`adopt_spacing`'s comment named this exact consequence while fixing the sibling).
  const RE_COLS = 10, RE_ROWS = 3;
  const lostEvent2 = once("webglcontextlost");
  lose.loseContext();
  await lostEvent2;
  // A consumer's re-fit — a `ResizeObserver` fire, a font change, a window drag — arriving while the
  // context is dead. This is the whole reachability story: a loss can start at any moment.
  r.resize(RE_COLS, RE_ROWS);
  const gridWhileLost = [r.cols(), r.rows()];
  // Read the CSS box too, because the consumer sets `canvas.style.width/height` from these
  // immediately after `resize` (justerm-web's `JustermRenderer.resize`). A clobbered grid therefore
  // collapses the *visible* box as well, not merely internal state — the half that reaches a user.
  const cssWhileLost = [r.cssWidth(), r.cssHeight()];
  // Snapshot the cell HERE, not at the end of the page: a later section changes the font size, so a
  // comparand read in the `checks` block would describe a different cell than the box beside it.
  // (Caught by this check going red when that section was added — the cell is derived state and a
  // reader of it holds a value with a lifetime, exactly as the map's invariant note says.)
  const cssCellAtLoss = [r.cssCellWidth(), r.cssCellHeight()];
  // The canvas ATTRIBUTE too, and it is a separate assertion on purpose. `resize` requires
  // `canvas.width`, `size` and `grid_size` to agree — "three values disagreeing" is the state its
  // own comment forbids — and that agreement is the only thing broken by writing the attribute
  // after the guard instead of before it. Verified by mutation: moving the guard above the two
  // `set_width`/`set_height` calls leaves every other check on this page green, because `restore`
  // re-runs `resize` on a live context and repairs the attribute before anything else reads it.
  const attrWhileLost = [canvas.width, canvas.height];
  await new Promise((res) => setTimeout(res, 0));
  const restoredEvent2 = once("webglcontextrestored");
  lose.restoreContext();
  await restoredEvent2;
  r.render();
  const gridAfterRestore = [r.cols(), r.rows()];

  // --- #639, the window the section above SKIPS: before the event is dispatched -----------------
  // The section above awaits `webglcontextlost` and only then resizes, so it drives the state the
  // renderer already knows about. That is not the whole hazard, and a guard written against it
  // passes while the defect survives: the browser kills a context **synchronously** and merely
  // QUEUES the event, so between `loseContext()` and the dispatch, `gl.isContextLost()` is already
  // true and `drawingBufferWidth` already reads 0 while our state machine still says "live".
  // Measured in that window against a build guarding on the flag: `resize(10, 3)` -> `[1, 1]`,
  // still `[1, 1]` after the restore. Hence the guard is on the read-back, not on the flag.
  //
  // Everything here runs with NO await between `loseContext()` and the calls, deliberately. Do not
  // "tidy" an await into it — that is precisely the edit that would make this section prove the
  // section above again.
  const cellBeforeRace = [r.cell_width(), r.cell_height()];
  const RACE_COLS = 12, RACE_ROWS = 4, RACE_FONT = 30;
  lose.loseContext();
  const raceFlags = { rendererSaysLost: r.isContextLost(), glSaysLost: gl.isContextLost() };
  r.resize(RACE_COLS, RACE_ROWS);
  const gridInRace = [r.cols(), r.rows()];
  // A sibling setter in the same window. It must neither throw nor silently drop the request: with
  // the flag-only predicate `set_font_size` threw `no uniform u_padding_frac`, because it took the
  // live path and re-baked into a dead context.
  let raceSetterThrew = false;
  try { r.setFontSize(RACE_FONT); } catch { raceSetterThrew = true; }
  const lostEvent3 = once("webglcontextlost");
  await lostEvent3;
  await new Promise((res) => setTimeout(res, 0));
  const restoredEvent3 = once("webglcontextrestored");
  lose.restoreContext();
  await restoredEvent3;
  r.render();
  const gridAfterRace = [r.cols(), r.rows()];
  const cellAfterRace = [r.cell_width(), r.cell_height()];

  // --- #639: the deferred adopt-what-fits pass actually runs, and clamps -------------------------
  // The whole rationale for committing the grid and deferring the check is that `restore` re-runs
  // the loop on a live context. Nothing above asserts it, because 10x3 and 12x4 are granted in
  // full — so a mutation that skips the deferred pass entirely passes every other check here.
  // Ask for a grid the drawing buffer provably cannot hold, and require the restore to shrink it.
  //
  // Direction only, never absolute numbers: `MAX_TEXTURE_SIZE` and the cell both differ between
  // this machine and CI's software GL, and an absolute expectation would encode one of them.
  const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  const HUGE_COLS = Math.ceil((maxTex * 2) / r.cell_width()), HUGE_ROWS = 2;
  const lostEvent4 = once("webglcontextlost");
  lose.loseContext();
  await lostEvent4;
  r.resize(HUGE_COLS, HUGE_ROWS);
  const hugeWhileLost = [r.cols(), r.rows()];
  await new Promise((res) => setTimeout(res, 0));
  const restoredEvent4 = once("webglcontextrestored");
  lose.restoreContext();
  await restoredEvent4;
  r.render();
  const hugeAfterRestore = [r.cols(), r.rows()];
  const hugeBuffer = [gl.drawingBufferWidth, gl.drawingBufferHeight];

  window.__proof = {
    deviceCell: deviceCell(r), cssCell: [r.cssCellWidth(), r.cssCellHeight()], dpr: window.devicePixelRatio,
    // The LIVE grid, not a literal: the #639 sections leave the renderer wherever the last deferred
    // adopt pass put it, and the final one is deliberately clamped by an amount that differs per
    // machine. Feeding the tripwire the live pair keeps it doing its own job — the grid must equal
    // the drawing buffer — on a grid this change chose, which is the device-pixel half of the proof
    // that `cols()`/`rows()` alone cannot show.
    gridFit: gridFit(gl, r, r.cols(), r.rows()),
    baseline, recovered, steady, lostFlag, restoredFlag, cursorBaseline, cursorRecovered,
    gridWhileLost, gridAfterRestore, cssWhileLost, attrWhileLost,
    raceFlags, gridInRace, gridAfterRace, raceSetterThrew, cellBeforeRace, cellAfterRace,
    maxTex, HUGE_COLS, hugeWhileLost, hugeAfterRestore, hugeBuffer,
    checks: {
      // Sanity: every cell — ASCII, dynamic narrow, and both halves of the wide pair — has ink
      // before the loss. (col 4 is the wide spacer: it shows 中's right half.)
      baselineRenders: baseline.every((n) => n > 0),
      // AC1: the lost event was detected and flipped the flag.
      lossDetected: lostFlag === true,
      // A dead context is skipped, not drawn on and not thrown from.
      renderWhileLostIsSilent: threwWhileLost === false,
      // AC2/AC3: the flag cleared and the rebuild+repaint happened without the consumer's help.
      restoreClearsFlag: restoredFlag === false,
      rebuildDidNotThrow: threwOnRestore === false,
      // THE assertion. Identical pixels, from `render()` alone. Fails (all-zero) if `restore()`
      // forgets `invalidate_baseline`, or skips the atlas re-bake, or leaves the viewport unset.
      recoveredMatchesBaseline:
        recovered.every((n) => n > 0) && recovered.join() === baseline.join(),
      // Named sub-assertions so a failure says WHICH bake path regressed, rather than just "≠".
      recoveredAsciiFastPath: recovered[0] > 0 && recovered[1] > 0 && recovered[5] > 0,
      recoveredDynamicNarrowGlyph: recovered[2] === baseline[2] && recovered[2] > 0,
      recoveredDynamicWideGlyph:
        recovered[3] === baseline[3] && recovered[4] === baseline[4] &&
        recovered[3] > 0 && recovered[4] > 0,
      // The dirty-region diff is healthy again afterwards.
      steadyStateHolds: steady.join() === baseline.join(),
      // #370: the bar cursor was lit before the loss and is lit again after restore+render() alone —
      // `restore()` re-fetched and re-set the cursor uniforms. (recoveredMatchesBaseline also now
      // guards this, since the bar's red is part of col 5's baseline; this names it directly.)
      cursorLitBeforeLoss: cursorBaseline > 0,
      cursorRecoveredAfterRestore: cursorRecovered > 0 && cursorRecovered === cursorBaseline,

      // #639: the grid a consumer asks for while the context is dead is the grid it keeps. Measured
      // before the fix: `[1, 1]` — `cells_that_fit(0, cell)` floors both axes.
      aResizeWhileLostKeepsTheGridItWasGiven:
        gridWhileLost[0] === RE_COLS && gridWhileLost[1] === RE_ROWS,
      // ...and the restore rebuilds at THAT grid, because `restore()` re-derives the buffer from
      // `grid_size` (#269). This is what makes the deferral free: there is no target to remember.
      andTheRestoreRebuildsAtThatGrid:
        gridAfterRestore[0] === RE_COLS && gridAfterRestore[1] === RE_ROWS,
      // The CSS box the consumer would set from this resize still describes that grid. A tolerance,
      // not equality: `cssWidth()` divides `cols * cell` by the dpr while this multiplies the
      // already-divided cell, and the two orders differ in the last f32 bit at fractional ratios.
      andTheCssBoxStillDescribesThatGrid:
        Math.abs(cssWhileLost[0] - RE_COLS * cssCellAtLoss[0]) < 0.01 &&
        Math.abs(cssWhileLost[1] - RE_ROWS * cssCellAtLoss[1]) < 0.01,
      // ...and `canvas.width`/`height` moved with them, so the three values `resize` keeps in step
      // are still in step *during* the loss, not merely once the restore has repaired them.
      andTheCanvasAttributeAgreesWhileStillLost:
        attrWhileLost[0] === RE_COLS * CW && attrWhileLost[1] === RE_ROWS * CH,

      // #639, the pre-event window. The first two are a PRECONDITION check, not a result: if the
      // browser ever starts dispatching `webglcontextlost` synchronously, this section stops
      // driving the race and the two below it would pass for the wrong reason. Assert the window
      // exists before asserting anything about behaviour inside it.
      theRaceWindowIsRealAndTheFlagLagsTheContext:
        raceFlags.glSaysLost === true && raceFlags.rendererSaysLost === false,
      aResizeBeforeTheLossEventIsDispatchedStillKeepsItsGrid:
        gridInRace[0] === RACE_COLS && gridInRace[1] === RACE_ROWS &&
        gridAfterRace[0] === RACE_COLS && gridAfterRace[1] === RACE_ROWS,
      // A sibling setter in that same window neither throws nor drops the request: the font size it
      // was given is the one the restore bakes at, so the cell must have grown.
      andASiblingSetterInThatWindowNeitherThrowsNorIsDropped:
        raceSetterThrew === false && cellAfterRace[1] > cellBeforeRace[1],

      // #639: the deferred adopt-what-fits pass runs at restore and really does clamp. Direction
      // only — `maxTex` and the cell differ between this machine and CI's software GL.
      theDeferredGridIsReportedUnverifiedWhileLost:
        hugeWhileLost[0] === HUGE_COLS,
      andTheRestoreRunsTheDeferredAdoptPassAndShrinksIt:
        hugeAfterRestore[0] < HUGE_COLS && hugeAfterRestore[0] >= 1 &&
        hugeAfterRestore[0] * r.cell_width() <= hugeBuffer[0],
    },
  };
  window.__proof.ok = Object.values(window.__proof.checks).every(Boolean);
  window.__done = true;
</script>
