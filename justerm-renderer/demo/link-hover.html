<!doctype html>
<meta charset="utf-8" />
<title>justerm-renderer proof — hovered link underline (#934)</title>
<style>
  body { margin: 0; background: #000; }
  #c { display: block; image-rendering: pixelated; }
</style>
<!--
  #934: `setLinkHover(grid, spans)` underlines the hovered link's cells, and it arrives with no frame —
  a pointer moving over a link changes nothing the engine sends. So the damage is applied ONCE, and
  each state after it is only a setter call and a `render()`.

  Four SPACE cells: no glyph, so the only ink in a cell is its underline. Cell 3 carries a real SGR 4
  underline — the positive control, and the rows a hovered cell's line must land on. Cells 1..2 are
  hovered; cell 0 is not. Runner sweeps dpr 1 / 1.1 / 1.5 / 2.

  Build: wasm-pack build --target web --dev --out-dir pkg
-->
<canvas id="c" width="64" height="32"></canvas>
<script type="module">
  import init, { JustermRenderer } from "../pkg/justerm_renderer.js";
  import { readRect, fitGrid } from "./proof.js";
  await init();

  const UNDERLINE = 1 << 3;
  const COLS = 4, ROWS = 1, N = COLS * ROWS;
  const SPACE = 0x20;

  const r = new JustermRenderer("#c");
  const g = r.addGrid(new Uint32Array(256), 0xffffff, 0x000000);
  const gl = document.querySelector("#c").getContext("webgl2");

  const grab = () => { const [w, h] = [gl.drawingBufferWidth, gl.drawingBufferHeight]; return { ...readRect(gl, { x: 0, y: 0, w, h }), w, h }; };
  const px = (img, x, y) => { const i = ((img.h - 1 - y) * img.w + x) * 4; return img.buf[i] + img.buf[i + 1] + img.buf[i + 2]; };

  // The retained-grid path (`apply_damage`), which is the one a setter can re-pack with no frame —
  // `apply_frame` retains nothing to re-pack from (#421), and the widget drives `apply_damage`.
  fitGrid(r, g, COLS, ROWS);
  const flags = new Uint16Array(N); flags[3] = UNDERLINE;
  const header = new Uint32Array([COLS, ROWS, 0 /* Full */, 0, 0, 0, 0, 1 /* blink_on */]);
  const spans = new Uint32Array([0, 0, COLS - 1, 0, N]);
  r.apply_damage(g, header, spans, new Uint32Array(N).fill(SPACE), new Uint32Array(N), new Uint32Array(N), flags, new Uint32Array(N), []);
  const [cw, ch] = [r.cell_width(g), r.cell_height(g)];

  // The pixel rows of cell `col` that carry ink — an underline is the only thing that can.
  const inkRows = (img, col) => {
    const rows = [];
    for (let y = 0; y < ch; y++) {
      let lit = false;
      for (let x = col * cw; x < (col + 1) * cw; x++) if (px(img, x, y) > 200) lit = true;
      if (lit) rows.push(y);
    }
    return rows;
  };
  const state = () => { r.render(); const img = grab(); return [0, 1, 2, 3].map((c) => inkRows(img, c)); };

  const before = state();
  r.setLinkHover(g, new Uint32Array([0, 1, 2]));
  const hovered = state();
  r.setLinkHover(g, new Uint32Array(0));
  const cleared = state();

  const same = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
  const checks = {
    // The control draws: the page can see an underline at all.
    theSgr4ControlIsUnderlined: hovered[3].length > 0,
    // Before any hover, only the control has ink.
    nothingElseIsInkedBeforeTheHover: before[0].length === 0 && before[1].length === 0 && before[2].length === 0,
    // The setter alone, with no frame, underlines the hovered cells on the control's rows.
    theHoveredCellsAreUnderlinedWhereSgr4Draws: same(hovered[1], hovered[3]) && same(hovered[2], hovered[3]),
    // The span ends where it says: the cell left of it stays bare.
    theCellOutsideTheSpanStaysBare: hovered[0].length === 0,
    // Empty spans clear it, and leave the application's own underline alone.
    clearingRemovesOnlyTheHover: cleared[1].length === 0 && cleared[2].length === 0 && same(cleared[3], hovered[3]),
  };

  window.__proof = { ok: Object.values(checks).every(Boolean), checks, dpr: devicePixelRatio, measured: { cw, ch, before, hovered, cleared } };
  window.__done = true;
</script>
