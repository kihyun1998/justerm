<!doctype html>
<meta charset="utf-8" />
<title>justerm-renderer proof — a glyph's ink may leave its cell (I_neighbour, #791)</title>
<style>
  body { margin: 0; background: #000; }
  #c { display: block; image-rendering: pixelated; }
</style>
<!--
  ADR-0019 R1.2 / rule 6. A glyph whose ink exceeds its cell used to have that ink destroyed — at
  bake, by a slot the size of the cell, and again at sample, by a texcoord inset that never reached
  past it. The band and `I_neighbour` give it somewhere to land; this page is what says it arrived.

  Three things are asserted, and the third is the one that makes the first two mean something:

    - a glyph THIS FONT cannot fit VERTICALLY in its cell draws all of its ink, counted against the
      same glyph drawn with no cell at all. The probe must fit horizontally: the band is vertical
      only, and the horizontal residue is tracked separately, not fixed here;
    - the ink lands on the NEIGHBOUR, not inside the owner (otherwise the owner simply grew);
    - `g`, `M` and the full block — which always fitted — are unchanged, so the instrument is not
      merely counting more pixels everywhere.

  **The probe glyph is chosen at runtime, never hard-coded.** The cell is the ink box of this font's
  block glyph (ADR-0022), so which codepoints overflow is a property of the font the machine happens
  to have: locally `monospace` resolves to a face where combining marks spill, on CI it is something
  else (#578 — no absolute cell dimension is portable). The page measures the cell, then picks a
  candidate the cell provably cannot hold. If none of them overflows, the page reports `skipped`
  rather than passing: a proof that cannot see the thing it is for must not read as green.

  Build: wasm-pack build --target web --dev --out-dir pkg
-->
<canvas id="c" width="64" height="128"></canvas>
<script type="module">
  import init, { JustermRenderer } from "../pkg/justerm_renderer.js";
  import { readRect } from "./proof.js";
  await init();

  const palette = new Uint32Array(256);
  const r = new JustermRenderer("#c");
  const g = r.addGrid(palette, 0xffffff, 0x000000);
  const canvas = document.querySelector("#c");
  const gl = canvas.getContext("webgl2");
  const dpr = window.devicePixelRatio;
  const [cw, ch] = [r.cell_width(g), r.cell_height(g)];

  // The same font string the rasteriser bakes with, drawn where no cell can clip it. This is the
  // independent source of truth: what the FONT draws, measured at the renderer's own alpha
  // threshold rather than re-derived from the renderer's own output.
  const FONT = `${16 * dpr}px monospace, monospace`;
  const big = Math.ceil(16 * dpr * 4);
  const off = new OffscreenCanvas(big, big).getContext("2d", { willReadFrequently: true });
  off.textBaseline = "alphabetic";
  off.textAlign = "left";
  const base = 16 * dpr * 2;

  /** Ink the font draws for `text`, and how far it reaches past the cell, in device px. */
  const freeInk = (text) => {
    off.clearRect(0, 0, big, big);
    off.font = FONT;
    off.fillStyle = "white";
    off.fillText(text, base, base);
    const d = off.getImageData(0, 0, big, big).data;
    let lit = 0, minY = 1e9, maxY = -1, minX = 1e9, maxX = -1;
    for (let y = 0; y < big; y++)
      for (let x = 0; x < big; x++)
        if (d[(y * big + x) * 4 + 3] >= 128) {
          lit++;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
        }
    return { lit, above: base - minY, below: maxY - base, minX, maxX };
  };

  // The cell's own reach, from the glyph it is measured by.
  const blockInk = freeInk("█");

  // Candidates that stack marks or drop tails past a block's box in SOME face. Ordered widest-reach
  // first so the strongest available case is the one taken.
  // A caron or ring reaches ABOVE a capital; a cedilla, ogonek or comma-below drops past the
  // baseline. Both directions are represented so a font that spares one still exercises the other.
  const CANDIDATES = [
    "Ǐ", "Ǒ", "Ǔ", "Ǎ", "Ǻ", "Å", "Ẫ",          // over the top
    "ƥ", "ǭ", "ǥ", "Ą", "ę", "į", "ų", "Ç", "ç", "Ģ", "ņ", "ŗ", "ǰ", "ᾷ", // under the baseline
  ];
  // Vertically over the cell — and horizontally INSIDE it, tested against the cell's own x range
  // rather than against its width. #791 reserves a band on the vertical axis only, so a probe that
  // also spills sideways would fail an ink-total assertion for a reason this change never claimed
  // to fix. Both traps were met writing this page: `Ẫ` is wider than the cell (its 12 missing
  // pixels are all at the baseline, where the A's legs splay), and `ᾷ` is exactly as wide as the
  // cell but sits 2 px to the right of it — so a width test passes it and it still overflows.
  const probe = CANDIDATES.map((t) => ({ t, ink: freeInk(t) })).find(
    ({ ink }) =>
      (ink.above > blockInk.above || ink.below > blockInk.below) &&
      ink.minX >= blockInk.minX &&
      ink.maxX <= blockInk.maxX,
  );

  const RED = (2 << 24) | 0xFF_00_00;
  const BLUE = (2 << 24) | 0x00_80_FF;

  /**
   * Draw `text` in the middle row of a 1x3 grid and report what reached the buffer, per row.
   *
   * `opts.fill` puts a glyph in the two receiving rows: without it every receiver is EMPTY, and
   * then nothing below `I_neighbour`'s position in rule 6 is ever composited — which is how three
   * defects (a colour emoji's overflow drawn monochrome, a block cursor the withdrawal could not
   * see, a wide pair cut in half) survived this corpus until a lens went looking.
   */
  const drawn = (text, opts = {}) => {
    const { select = null, fill = null, cursorRow = -1, restore = false } = opts;
    const [ROWS, COLS] = [3, 1];
    r.resizeGrid(g, COLS, ROWS);
    r.resizeSurface(COLS * cw, ROWS * ch);
    r.setViewport(g, 0, 0, COLS * cw, ROWS * ch);
    // A selection is how this page makes two adjacent cells differ in RESOLVED background while
    // both still hold the same reference — the exact case the withdrawal rule is written for.
    r.setOverlay(g, new Uint32Array(select ?? []), new Uint32Array(), 0x30_60_C0, 0x30_60_C0);
    // `shape: 0` is the BLOCK, and "no cursor" is `clearCursor` — not shape 0, which is what this
    // page assumed at first and which quietly painted a blue block over row 0 in every draw,
    // failing even the controls. A block is a background applied per fragment, so the packer cannot
    // see it and rule 5's withdrawal has to be completed in the shader; that is what this exercises.
    if (cursorRow >= 0) r.setCursor(g, 0, cursorRow, 0, 0x00_00_FF, 0x00_FF_00);
    else r.clearCursor(g);
    const cps = new Uint32Array(ROWS);
    const fg = new Uint32Array(ROWS);
    cps[1] = text.codePointAt(0);
    fg[1] = RED; // the owner's ink, so foreign pixels are identifiable by colour
    if (fill) {
      cps[0] = fill.codePointAt(0);
      cps[2] = fill.codePointAt(0);
      fg[0] = BLUE;
      fg[2] = BLUE;
    }
    r.apply_frame(g, COLS, ROWS, new Uint32Array(ROWS), fg, cps, new Uint16Array(ROWS), true);
    r.render();
    const { buf } = readRect(gl, { x: 0, y: 0, w: COLS * cw, h: ROWS * ch });
    // Count per grid row, splitting by COLOUR: red is the owner's ink wherever it landed, blue is
    // the receiver's own. `readPixels` is bottom-origin, so grid row 0 is the TOP of the buffer.
    const perRow = [0, 0, 0];
    const redRow = [0, 0, 0];
    for (let y = 0; y < ROWS * ch; y++) {
      const row = Math.floor((ROWS * ch - 1 - y) / ch);
      for (let x = 0; x < COLS * cw; x++) {
        const i = (y * COLS * cw + x) * 4;
        const [R, G, B] = [buf[i], buf[i + 1], buf[i + 2]];
        if (R >= 128 || G >= 128 || B >= 128) perRow[row]++;
        if (R >= 128 && G < 64 && B < 64) redRow[row]++;
      }
    }
    return { perRow, redRow, total: perRow[0] + perRow[1] + perRow[2] };
  };

  const checks = {};
  if (!probe) {
    checks.probeAvailable = false;
  } else {
    const free = probe.ink;
    const own = drawn(probe.t);
    // 1. Every pixel the font drew reached the buffer.
    checks.theWholeGlyphIsDrawn = own.total === free.lit;
    // 2. ...and some of it is on a neighbour, which is what makes this I_neighbour rather than a
    //    cell that merely got taller.
    checks.someInkLandedOnANeighbour = own.perRow[0] + own.perRow[2] > 0;
    // 3. DIRECTION. Ink that rose above the owner belongs to the row above and nowhere else.
    //    Without this, flipping the shader's `+ u_cell_uv.w` to `-` still passes every other check
    //    here — the host tests that pin direction run against `ink_rows`, and the shader is only
    //    ever executed in a browser.
    const overAbove = free.above > blockInk.above;
    checks.theInkLandsOnTheCorrectSide = overAbove
      ? own.perRow[0] > 0 && own.perRow[2] === 0
      : own.perRow[2] > 0 && own.perRow[0] === 0;

    // 4. The withdrawal, both edges at once: a selection on the OWNER's row makes both backgrounds
    //    differ, so nothing crosses.
    const split = drawn(probe.t, { select: [1, 0, 0] });
    checks.withdrawnAtABackgroundEdge = split.redRow[0] === 0 && split.redRow[2] === 0;

    // 5. ...and ONE edge only: selecting the receiving row withdraws that side and leaves the
    //    other, which a both-sides test cannot tell from a withdrawal that fires unconditionally.
    // Counted in RED, not in lit pixels: a selection and a block cursor both PAINT the receiving
    // cell, so "did the foreign ink stop" cannot be asked of total coverage — the cell is full
    // either way. The owner's ink is the only red on the surface.
    const oneSide = drawn(probe.t, { select: [overAbove ? 0 : 2, 0, 0] });
    checks.withdrawnOnOneEdgeOnly =
      oneSide.redRow[overAbove ? 0 : 2] === 0 && oneSide.redRow[1] === own.redRow[1];

    // 6. A RECEIVER WITH CONTENT. Every check above leaves the neighbours empty, so nothing below
    //    `I_neighbour` in rule 6 is ever composited. With the receiver holding its own blue glyph,
    //    the foreign ink must still arrive AND still be the OWNER's red — the receiver's colour
    //    must not claim it (ADR-0019 R1.2), and the receiver's own ink must not be displaced.
    const filled = drawn(probe.t, { fill: "M" });
    const plainM = drawn("M", { fill: "M" });
    checks.aReceiverKeepsItsOwnInk =
      filled.perRow[overAbove ? 0 : 2] > plainM.perRow[overAbove ? 0 : 2];
    checks.foreignInkKeepsItsOwnersColour = filled.redRow[overAbove ? 0 : 2] > 0;

    // 7. A block cursor on the receiving row is a background edge the packer cannot see, so the
    //    withdrawal has to happen in the shader.
    const underCursor = drawn(probe.t, { cursorRow: overAbove ? 0 : 2 });
    checks.withdrawnUnderABlockCursor = underCursor.redRow[overAbove ? 0 : 2] === 0;

    checks.probeAvailable = true;
  }

  // NOT GUARDED HERE: a colour emoji's overflow keeping the atlas's own colours (#791). The
  // shader change is real — the neighbour sample now mixes `tex.rgb` under the owner's emoji bit,
  // exactly as the own-cell path does — but a proof for it needs a probe this page cannot express.
  // An emoji is a WIDE glyph, and a wide glyph is baked across a two-cell advance and split, which
  // is not the path `freeInk`'s single `fillText` measures: a check gated on that measurement asked
  // for overflow the renderer does not produce. Measured at dpr 1.5, one column, two columns and a
  // proper lead+spacer pair all put ZERO emoji ink in the neighbouring row. A valid guard has to
  // take its precondition from the renderer's own bake rather than from a 2D canvas.

  // Controls: glyphs that always fitted must be untouched, or "more ink everywhere" would pass 1.
  // `█` is the load-bearing one — it is what catches a bake origin that forgot the band, which is a
  // real bug this page's first version found (a run of blocks stopped meeting its neighbour).
  for (const [name, chr] of [["g", "g"], ["M", "M"], ["block", "█"]]) {
    const d = drawn(chr);
    checks[`${name}IsUnchanged`] = d.total === freeInk(chr).lit && d.perRow[0] === 0 && d.perRow[2] === 0;
  }

  const ok = Object.values(checks).every(Boolean);
  window.__proof = {
    ok,
    checks,
    probe: probe ? probe.t : null,
    cell: [cw, ch],
    blockReach: blockInk,
    probeReach: probe ? probe.ink : null,
    dpr,
  };
  // The runner waits on this, not on `__proof` (`e2e/proofs.spec.mjs`).
  window.__done = true;
</script>
