[package]
name = "justerm-renderer"
# Independent version track: this crate is EXCLUDED from the root workspace
# (see the root Cargo.toml comment + ADR-0018). web-sys/glow make it wasm32-only,
# so it must stay out of the host `cargo test --workspace` gate; its own gate is
# `cargo build --manifest-path justerm-renderer/Cargo.toml --target wasm32-unknown-unknown`.
# NOT `-p justerm-renderer`: a `-p` flag selects from the workspace, and this crate is in none,
# so that form errors with "did not match any packages" (#608).
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kihyun1998/justerm"
description = "First-party WebGL2 terminal grid renderer for the justerm family. Reimplements the third-party beamterm renderer in justerm's own architecture (ADR-0018, supersedes ADR-0002)."
homepage = "https://github.com/kihyun1998/justerm/tree/master/justerm-renderer#readme"
# wasm-pack copies these into the generated pkg/package.json, so they are the npm package's
# discovery metadata too — not just crates.io's (#473). Cargo caps `keywords` at 5.
keywords = ["terminal", "webgl", "renderer", "wasm", "ansi"]
# Published as an npm artifact via wasm-pack, not to crates.io (like justerm-wasm-decode).
publish = false

# This crate is its own workspace root, stated HERE rather than only implied by the root
# manifest's `exclude` (#608). The two are not equivalent: `exclude` is a fact about one
# directory, so cargo — which walks *upward* from the crate looking for a workspace —
# resolves it correctly only when the crate sits under that exact root. From a git worktree
# it does not: the worktree's root excludes the crate, so cargo keeps climbing, reaches the
# main checkout's manifest, and matches the crate against an `exclude` list of paths that
# are not this one. It then declares the crate a member that is not there, and **every**
# renderer gate — fmt, test, clippy, build, doc, and `wasm-pack build` — fails before it
# starts. Worktrees are the prescribed workflow (`docs/agents/theflow.md` § Step 7), so that
# is the normal path, not an edge case. `fuzz/Cargo.toml` has carried this line all along.
[workspace]

# `cdylib` is the wasm artifact wasm-pack ships; `rlib` lets the crate's own
# pure-logic tests + future wasm-bindgen-test targets link it.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.106"
js-sys = "0.3.81"
glow = "0.18"
console_error_panic_hook = "0.1.7"
lru = "0.18"
# NFC-normalise grapheme-cluster keys so a decomposed cluster (e + combining acute)
# and its precomposed form share one atlas slot (#285; glyph_cache consumer contract).
unicode-normalization = "0.1"

[dependencies.web-sys]
version = "0.3.81"
features = [
    "Window",
    "Document",
    "Element",
    # `webglcontextlost` / `webglcontextrestored` listeners on the canvas (#269).
    "EventTarget",
    "Event",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlTexture",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "TextMetrics",
    "ImageData",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
