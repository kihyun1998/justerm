[package]
name = "justerm-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs a command in a pseudo-terminal and drives a justerm Session from it: the read loop, the pump timer and exit detection."
readme = "README.md"
keywords = ["terminal", "pty", "conpty", "justerm"]
categories = ["command-line-interface"]

[dependencies]
justerm-core = { path = "../justerm-core", version = "0.34.0" }
portable-pty = "0.9"
# portable-pty reports through anyhow without re-exporting it; named here to unwrap the io::Error inside.
anyhow = "1"

# A resize back to the child's size signals its foreground process group itself (`killpg`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The test binary is also the child it spawns, so libtest's output must stay out of the terminal.
[[test]]
name = "pty"
harness = false

[dev-dependencies]
# The size-reporting helper child (tests/pty.rs) reads its own terminal size.
terminal_size = "0.4"

